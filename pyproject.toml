[project]
name = "ai-engineering"
version = "0.1.0"
description = "Aprendizaje de AI Engineering: de Python a LLMs"
requires-python = ">=3.11"
dependencies = [
    "numpy",
    "pandas",
    "matplotlib",
    "scikit-learn",
    "jupyterlab",
    "ipykernel",
    "python-dotenv",
    "anthropic",
    "pytest",
]

[dependency-groups]
# Se instalan bajo demanda: uv sync --group dl   /   --group rag   /   --group serving
dl = ["torch", "transformers", "datasets"]
rag = ["chromadb", "sentence-transformers"]
serving = ["fastapi", "uvicorn[standard]"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]